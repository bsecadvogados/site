<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda BSC Advogados | Agro Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="agro-background"></div>

    <main class="agenda-wrapper">
        <header class="agenda-header">
            <div class="logo-area">
                <h1>BSC ADVOGADOS</h1>
                <span>DIREITO AGRÁRIO & AGRONEGÓCIO</span>
            </div>
            <div class="date-now" id="currentDate">Segunda-feira, 02 de Fevereiro</div>
        </header>

        <div class="weekly-display" id="weeklyGrid">
            </div>

        <section class="detail-section">
            <div class="detail-card">
                <div class="detail-info">
                    <h2 id="selectedDayTitle">Compromissos do Dia</h2>
                    <div id="eventTimeline" class="event-timeline">
                        </div>
                </div>
                <div class="detail-visual">
                    <img src="https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&q=80&w=1000" alt="Agro Business" id="contextImage">
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>

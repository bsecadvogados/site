<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSC Advogados | Governança & Agenda Agro</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="dynamicBg"></div>
    <div class="overlay"></div>

    <div class="container">
        <header>
            <div class="logo-box">
                <img src="img/logo.png" alt="BSC Advogados" class="main-logo">
                <div class="brand-h">
                    <h1>BSC ADVOGADOS</h1>
                    <p>DIREITO AGRÁRIO & AGRONEGÓCIO</p>
                </div>
            </div>
            <div id="clock">00:00:00</div>
        </header>

        <section class="socio-grid">
            <div class="card-socio">
                <div class="photo-frame"><img src="img/giovani.jpg" alt="Dr. Giovani"></div>
                <h3>Dr. Giovani</h3>
                <span>Sócio Proprietário</span>
            </div>
            <div class="card-socio">
                <div class="photo-frame"><img src="img/abimael.jpg" alt="Dr. Abimael"></div>
                <h3>Dr. Abimael</h3>
                <span>Sócio Proprietário</span>
            </div>
            <div class="card-socio">
                <div class="photo-frame"><img src="img/pamella.jpg" alt="Dra. Pamella"></div>
                <h3>Dra. Pamella</h3>
                <span>Sócia Proprietária</span>
            </div>
        </section>

        <section class="agenda-section">
            <div class="agenda-title"><h2>Agenda Institucional</h2></div>
            <nav class="nav-agenda" id="navAgenda"></nav>
            <div class="panel-compromissos" id="panelEvents"></div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>

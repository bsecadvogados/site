<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSC Advogados | Agenda Agro</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="dynamicBg" class="main-bg"></div>
    <div class="overlay"></div>

    <main class="content-container">
        <header class="main-header">
            <div class="logo-box">
                <h1>BSC ADVOGADOS</h1>
                <p>DIREITO AGRÁRIO & AGRONEGÓCIO</p>
            </div>
            <div id="clock" class="clock-display">00:00:00</div>
        </header>

        <nav class="days-nav" id="daysNav"></nav>

        <section class="agenda-panel">
            <div class="panel-header">
                <h2 id="viewTitle">Compromissos do Dia</h2>
                <span id="viewDate" class="gold-text"></span>
            </div>
            
            <div class="events-grid" id="eventsContainer">
                </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
